replicaCount: 1
revisionHistoryLimit: 1

image:
  repository: ghcr.io/ed-ad/git-instaweb
  tag: "latest"
  pullPolicy: IfNotPresent
  build:
    enabled: true
    context: ../../docker/git-instaweb
    dockerfile: Dockerfile

service:
  type: ClusterIP
  port: 8080
  annotations: {}

repo:
  mountPath: /srv/git
  repoPath: repo.git
  hostPath:
    enabled: true
    path: /var/lib/stupid-git/repos
    type: DirectoryOrCreate

resources: {}

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 2

networkPolicy:
  enabled: false
  # Uncomment and configure to enable network policy
  # podSelector: {}
  # policyTypes:
  #   - Ingress
  #   - Egress
  # ingress:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             app: trusted-app
  # egress:
  #   - to:
  #       - namespaceSelector: {}
  #     ports:
  #       - protocol: TCP
  #         port: 443
