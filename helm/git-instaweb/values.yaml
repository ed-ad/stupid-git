replicaCount: 1

image:
  repository: git-instaweb
  tag: "latest"
  pullPolicy: IfNotPresent
  build:
    enabled: true
    context: ../../docker/git-instaweb
    dockerfile: Dockerfile

service:
  type: ClusterIP
  port: 8080

repo:
  mountPath: /srv/git
  repoPath: repo.git
  hostPath:
    enabled: true
    path: /var/lib/stupid-git/repos
    type: DirectoryOrCreate

resources: {}

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
