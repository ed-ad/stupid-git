apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-instaweb.fullname" . }}
  labels:
    {{- include "git-instaweb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "git-instaweb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "git-instaweb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: gitweb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p "{{ .Values.repo.mountPath }}"
              REPO_DIR="{{ .Values.repo.mountPath }}/{{ .Values.repo.repoPath }}"
              if [ ! -d "$REPO_DIR" ] || { [ ! -d "$REPO_DIR/refs" ] && [ ! -d "$REPO_DIR/objects" ]; }; then
                git init --bare "$REPO_DIR"
              fi

              cat > /etc/gitweb.conf <<EOF
              $projectroot = "{{ .Values.repo.mountPath }}";
              $git_base_url = "http://localhost:{{ .Values.service.port }}";
              $projects_list = "{{ .Values.repo.mountPath }}";
              $site_name = "Stupid Git";
              $export_ok = "git-daemon-export-ok";
              $strict_export = "git-daemon-export-ok";
              EOF

              cat > /etc/lighttpd/conf.d/gitweb.conf <<EOF
              server.bind = "0.0.0.0"
              server.port = {{ .Values.service.port }}
              server.document-root = "/var/www"
              server.modules += ("mod_cgi", "mod_alias")

              alias.url += (
                "/gitweb.cgi" => "/usr/share/gitweb/gitweb.cgi",
                "/gitweb.css" => "/usr/share/gitweb/gitweb.css",
                "/gitweb.js" => "/usr/share/gitweb/gitweb.js",
                "/git-logo.png" => "/usr/share/gitweb/git-logo.png"
              )

              $HTTP["url"] =~ "^/gitweb" {
                  cgi.assign = ( ".cgi" => "/usr/bin/perl" )
              }
              EOF

              export GITWEB_CONFIG=/etc/gitweb.conf
              echo "gitweb is listening on http://0.0.0.0:{{ .Values.service.port }}/gitweb.cgi"
              exec lighttpd -D -f /etc/lighttpd/lighttpd.conf
          volumeMounts:
            - name: repo-data
              mountPath: {{ .Values.repo.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /gitweb.cgi
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /gitweb.cgi
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
      volumes:
        - name: repo-data
          {{- if .Values.repo.hostPath.enabled }}
          hostPath:
            path: {{ .Values.repo.hostPath.path | quote }}
            type: {{ .Values.repo.hostPath.type | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
