apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-instaweb.fullname" . }}
  labels:
    {{- include "git-instaweb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "git-instaweb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "git-instaweb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: gitweb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: GITWEB_CONFIG
              value: /etc/gitweb.conf
            - name: GIT_PROJECT_ROOT
              value: "{{ .Values.repo.mountPath }}"
            - name: GIT_HTTP_EXPORT_ALL
              value: "1"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p "{{ .Values.repo.mountPath }}"
              mkdir -p /var/log/lighttpd
              touch /var/log/lighttpd/access.log /var/log/lighttpd/error.log
              chown -R www-data:www-data /var/log/lighttpd
              REPO_DIR="{{ .Values.repo.mountPath }}/{{ .Values.repo.repoPath }}"
              if [ ! -d "$REPO_DIR" ] || { [ ! -d "$REPO_DIR/refs" ] && [ ! -d "$REPO_DIR/objects" ]; }; then
                git init --bare "$REPO_DIR"
              fi

              echo "git-http-backend is listening on http://0.0.0.0:{{ .Values.service.port }}/{{ .Values.repo.repoPath }}"
              tail -n +1 -F /var/log/lighttpd/access.log /var/log/lighttpd/error.log &
              exec lighttpd -D -f /etc/lighttpd/lighttpd.conf
          volumeMounts:
            - name: repo-data
              mountPath: {{ .Values.repo.mountPath }}
            - name: gitweb-config
              mountPath: /etc/gitweb.conf
              subPath: gitweb.conf
              readOnly: true
            - name: lighttpd-config
              mountPath: /etc/lighttpd/lighttpd.conf
              subPath: lighttpd.conf
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /{{ .Values.repo.repoPath }}/info/refs?service=git-upload-pack
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /{{ .Values.repo.repoPath }}/info/refs?service=git-upload-pack
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
      volumes:
        - name: repo-data
          {{- if .Values.repo.hostPath.enabled }}
          hostPath:
            path: {{ .Values.repo.hostPath.path | quote }}
            type: {{ .Values.repo.hostPath.type | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: gitweb-config
          configMap:
            name: {{ include "git-instaweb.fullname" . }}-config
            items:
              - key: gitweb.conf
                path: gitweb.conf
        - name: lighttpd-config
          configMap:
            name: {{ include "git-instaweb.fullname" . }}-config
            items:
              - key: lighttpd.conf
                path: lighttpd.conf
