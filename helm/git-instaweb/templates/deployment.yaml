apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-instaweb.fullname" . }}
  labels:
    {{- include "git-instaweb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "git-instaweb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "git-instaweb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: git-http
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: GIT_PROJECT_ROOT
              value: "{{ .Values.repo.mountPath }}"
            - name: GIT_HTTP_EXPORT_ALL
              value: "1"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p "{{ .Values.repo.mountPath }}"
              mkdir -p /var/log/lighttpd
              touch /var/log/lighttpd/access.log /var/log/lighttpd/error.log
              chown -R www-data:www-data /var/log/lighttpd
              cat > /usr/local/bin/git-http-backend-wrapper <<'EOF'
              #!/bin/sh
              export GIT_PROJECT_ROOT="{{ .Values.repo.mountPath }}"
              export GIT_HTTP_EXPORT_ALL="1"
              export REQUEST_METHOD="${REQUEST_METHOD:-GET}"
              export PATH_INFO="${PATH_INFO:-/{{ .Values.repo.repoPath }}/info/refs}"
              export QUERY_STRING="${QUERY_STRING:-service=git-upload-pack}"
              exec /usr/lib/git-core/git-http-backend
              EOF
              chmod 755 /usr/local/bin/git-http-backend-wrapper

              REPO_DIR="{{ .Values.repo.mountPath }}/{{ .Values.repo.repoPath }}"
              mkdir -p "{{ .Values.repo.mountPath }}"
              if ! git --git-dir="$REPO_DIR" rev-parse --is-bare-repository >/dev/null 2>&1; then
                git init --bare "$REPO_DIR"
              fi
              chown -R www-data:www-data "{{ .Values.repo.mountPath }}"

              echo "git-http-backend is listening on http://0.0.0.0:{{ .Values.service.port }}/{{ .Values.repo.repoPath }}"
              tail -n +1 -F /var/log/lighttpd/access.log /var/log/lighttpd/error.log &
              exec lighttpd -D -f /etc/lighttpd/lighttpd.conf
          volumeMounts:
            - name: repo-data
              mountPath: {{ .Values.repo.mountPath }}
            - name: lighttpd-config
              mountPath: /etc/lighttpd/lighttpd.conf
              subPath: lighttpd.conf
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /{{ .Values.repo.repoPath }}/info/refs?service=git-upload-pack
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /{{ .Values.repo.repoPath }}/info/refs?service=git-upload-pack
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
      volumes:
        - name: repo-data
          {{- if .Values.repo.hostPath.enabled }}
          hostPath:
            path: {{ .Values.repo.hostPath.path | quote }}
            type: {{ .Values.repo.hostPath.type | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: lighttpd-config
          configMap:
            name: {{ include "git-instaweb.fullname" . }}-config
            items:
              - key: lighttpd.conf
                path: lighttpd.conf
